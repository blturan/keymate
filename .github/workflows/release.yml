name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

run-name: Releasing keymate ${{ github.ref_name }} by @${{ github.actor }}

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag is signed
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          git verify-tag "$GITHUB_REF_NAME" || {
            echo "::error::$GITHUB_REF_NAME isn't signed by a key in .github/allowed_signers"
            exit 1
          }

      - name: Tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO"
            exit 1
          fi

      - name: Tag is newer than the last one
        run: |
          LATEST=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          [ -z "$LATEST" ] && exit 0
          LOWER=$(printf '%s\n%s\n' "${GITHUB_REF_NAME#v}" "${LATEST#v}" | sort -V | head -n 1)
          if [ "$LOWER" = "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::$GITHUB_REF_NAME is not newer than $LATEST"
            exit 1
          fi

  release:
    name: Build and publish
    needs: validate
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/keymate keymate-aarch64-apple-darwin

      # Releases are immutable once published, so upload to a draft first.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "keymate ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --draft \
            keymate-aarch64-apple-darwin

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Point the Homebrew formula at it
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "${{ github.event.repository.default_branch }}"
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 keymate-aarch64-apple-darwin | cut -d ' ' -f 1)
          OWNER="${{ github.repository_owner }}"
          sed -i '' \
            -e "s#/download/v[^/]*/#/download/v$VERSION/#" \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            -e "s#github\.com/[^/\"]*/keymate#github.com/$OWNER/keymate#g" \
            -e "s#brew tap [^/]*/keymate#brew tap $OWNER/keymate#" \
            Formula/keymate.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/keymate.rb
          git commit -m "chore: update Homebrew formula to keymate ${GITHUB_REF_NAME#v}" || exit 0
          git push origin HEAD
