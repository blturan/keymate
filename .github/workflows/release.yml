name: create_new_release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

run-name: Releasing (${{ github.ref_name }})

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Tag is signed
        run: |
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile .github/allowed_signers
          git verify-tag "$GITHUB_REF_NAME" || {
            echo "::error::$GITHUB_REF_NAME isn't signed by a key in .github/allowed_signers"
            exit 1
          }

      - name: Check Cargo.toml version matches tag
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -n1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: Tag ${{ github.ref_name }} does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "Cargo.toml version $CARGO_VERSION matches tag ${{ github.ref_name }}"

      - name: Check version is greater than latest
        run: |
          NEW_TAG="${{ github.ref_name }}"
          NEW_VERSION="${NEW_TAG#v}"

          LATEST_TAG=$(git tag --sort=-version:refname | grep -v "^${NEW_TAG}$" | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tags found, proceeding."
            exit 0
          fi

          LATEST_VERSION="${LATEST_TAG#v}"
          LOWER=$(printf "%s\n%s" "$NEW_VERSION" "$LATEST_VERSION" | sort -V | head -n1)

          if [ "$LOWER" = "$NEW_VERSION" ]; then
            echo "ERROR: New tag $NEW_TAG is lower than latest $LATEST_TAG"
            exit 1
          fi

          echo "Version $NEW_TAG is valid (latest was $LATEST_TAG)"

  build:
    name: Build for Apple silicon
    needs: validate
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Rename binary
        run: cp target/aarch64-apple-darwin/release/keymate keymate-aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keymate-aarch64-apple-darwin
          path: keymate-aarch64-apple-darwin
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            keymate-aarch64-apple-darwin

      - name: Point the Homebrew formula at it
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(sha256sum keymate-aarch64-apple-darwin | cut -d ' ' -f 1)
          sed -i \
            -e "s#/download/v[^/]*/#/download/v$VERSION/#" \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            Formula/keymate.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/keymate.rb
          git commit -m "chore: update Homebrew formula to keymate $VERSION" || exit 0
          git push origin HEAD
