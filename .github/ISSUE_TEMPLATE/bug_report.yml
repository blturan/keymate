name: Bug report
description: Something in Keymate doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For a security problem, please don't open an issue: see [SECURITY.md](https://github.com/blturan/keymate/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        I ran `keymate setup github`, chose Restore, and it said ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Keymate's output
      description: Copy it from your terminal. It doesn't contain your PIN or keys, but check it before posting.
      render: text
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `keymate doctor github`
      description: It only reads and never asks for a PIN or a touch.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Keymate version
      description: From `keymate --version`.
      placeholder: keymate 0.1.0
    validations:
      required: true

  - type: input
    id: key
    attributes:
      label: Security key
      description: The model, e.g. YubiKey 5C NFC or Security Key C NFC. `keymate devices` shows it.
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
